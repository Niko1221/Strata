# Strata: the single external entry point (TLS + authorization + forwarding)
#
#   /v1/*       inference API   — any valid API key
#   /health                       — open (no sensitive data)
#   / , /static/                  — UI shell: open, so a browser can load the page
#                                  and present a login form
#   /api/* , /ws/* , everything   — console: admin only
upstream manager { server manager:8088; }

server {
    listen 38888 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;            # base64 image uploads

    # ---------- inference API: any valid key ----------
    location /v1/ {
        auth_request /_auth;
        proxy_pass http://manager;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 700s;         # long generations
        proxy_buffering off;             # stream SSE straight through
        proxy_cache off;
    }

    # ---------- health check: open ----------
    location = /health {
        proxy_pass http://manager;
        proxy_set_header Host $host;
    }

    # ---------- UI shell (HTML/JS/CSS): open ----------
    # The browser must be able to load the page in order to ask for a key.
    # Every data endpoint below (/api/*, /ws/*) stays behind authorization.
    location = / {
        proxy_pass http://manager;
        proxy_set_header Host $host;
    }
    location /static/ {
        proxy_pass http://manager;
        proxy_set_header Host $host;
    }

    # ---------- login / setup endpoints: open ----------
    # Otherwise creating the first administrator would lock you out.
    location = /api/login {
        proxy_pass http://manager;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/setup-status {
        proxy_pass http://manager;
        proxy_set_header Host $host;
    }
    location = /api/auth/verify {
        proxy_pass http://manager;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        return 204;
    }

    # ---------- WebSocket: forwarded directly, authorized by the manager ----------
    # auth_request is skipped here on purpose: its subrequest does not inherit
    # the original query string, so `?api_key=` cannot be verified at this
    # layer. The manager's WebSocket endpoints check the session cookie or key.
    location /ws/ {
        proxy_pass http://manager;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;       # long-lived log / terminal sessions
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------- everything else = console: admin only ----------
    location / {
        auth_request /_auth;
        proxy_pass http://manager;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # auth_request callback (internal). The original query must be forwarded:
    # a browser WebSocket cannot set headers, so its key arrives as ?api_key=.
    location = /_auth {
        internal;
        proxy_pass http://manager/api/auth/verify$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Api-Key $arg_api_key;
    }

    error_page 401 = @authfail;
    location @authfail {
        default_type application/json;
        return 401 '{"error":{"message":"invalid or missing API key"}}';
    }
}
