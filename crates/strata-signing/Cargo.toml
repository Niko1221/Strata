[package]
name = "strata-signing"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Ed25519 feed/component and Tauri minisign verification for Strata."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64 = "0.22"
blake2 = "0.10"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
