ight="700" text-anchor="middle" fill="#b45309">19.9 s</text><text x="700" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1f2328">32K</text><rect x="1005.0" y="414.9" width="150" height="425.1" rx="8" fill="#f59e0b"/><text x="1080" y="398.9" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#b45309">80.1 s</text><text x="1080" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1f2328">128K</text><rect x="1385.0" y="241.8" width="150" height="598.2" rx="8" fill="#f59e0b"/><text x="1460" y="225.8" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#b45309">477.1 s</text><text x="1460" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1f2328">508K</text><text x="60" y="926" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#8b949e">engine-side timing - measured 2026-10-07 - 508K prompt = 508,255 tokens read at ~1,072 tok/s</text></svg>