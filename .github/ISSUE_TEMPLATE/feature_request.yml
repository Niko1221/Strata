name: Feature request
description: Suggest something new or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    value: |
      Explain what you want in plain language.
  - type: textarea
    id: idea
    attributes:
      label: What do you want to do?
      description: Describe the goal rather than the implementation. If there's a workaround you use today, mention it.
    validations:
      required: true
  - type: markdown
    value: |
      All of this counts: model and architecture support, the server and API, the web app, multi-GPU and layer split, images and vision, MCP servers, setup and installation, and performance.