name: Config snapshot

# tests/snapshot: what `strata launch`, the app's plain Load and the app's Models-screen Load hand the engine (arguments, environment, drafter,
# confidence), for every simulated machine class and model set, against the golden files in tests/snapshot/golden.  Nothing is loaded,
# downloaded or run on a GPU.  Windows and Linux must give byte-identical output, so both run.  A change that moves what users
# get has to update the golden files in the same commit (STRATA_SNAPSHOT_UPDATE=1 python -m pytest tests/snapshot, see tests/snapshot/README.md).

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snapshot.yml
      - tests/snapshot/**
      - serve/**
      - strata_cli/**
      - strata_control/**
      - setup.py
      - strata.py
      - requirements*.txt
      - apps/host/server/**
      - apps/host/package*.json
      - packaging/**
      - tools/check
  pull_request:
    paths:
      - .github/workflows/snapshot.yml
      - tests/snapshot/**
      - serve/**
      - strata_cli/**
      - strata_control/**
      - setup.py
      - strata.py
      - requirements*.txt
      - apps/host/server/**
      - apps/host/package*.json
      - packaging/**
      - tools/check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/host/package-lock.json
      - name: Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Host packages (the app's Load runs in Node)
        working-directory: apps/host
        run: npm ci --no-audit --no-fund
      - name: tools/check snapshot
        run: python tools/check --only snapshot --keep --scratch "${{ runner.temp }}/check"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.os }}
          path: ${{ runner.temp }}/check/*.log
          retention-days: 7
