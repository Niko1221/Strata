name: Backend compile checks

# Compile and link every engine backend with a pinned toolchain, without a GPU: nothing is run, so a call into a kernel that only
# exists for another backend (or an API a toolkit version dropped) fails here instead of on a user's machine.  Hardware runs are separate.
#   CUDA 12.9 and 13.0   nvidia/cuda devel container   target strata (no MMQ, the default) (CMake preset cuda-compile)
#   HIP (ROCm 7.2)       rocm/dev container            target strata                      (CMake preset hip-compile)
#   gfx90a M1 (ROCm 7.2) rocm/dev container            engine and GPU parity targets linked; only host policy/configuration checks run
#   SYCL (oneAPI 2026.1) ubuntu + Intel's apt repo     target strata of engine/sycl/             (the commands of tools/packaging/build_sycl_linux.sh)
#   Metal                macOS runner                  target strata                      (engine/metal/; metal-build.yml keeps its own strata build)
# ggml comes from the vendored engine/third_party/strata-ggml (frozen at llama.cpp's pin), the same tree the release builds use: nothing is downloaded.
# Architectures are fewer than the release package's (compile time); the flags that decide which sources and defines are built are the release's.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/backends.yml
      - engine/CMakeLists.txt
      - engine/CMakePresets.json
      - engine/cmake/**
      - engine/src/**
      - engine/include/**
      - engine/tests/core/hip_device_policy_test.cpp
      - engine/tests/hip/gfx90a*
      - tools/test_gfx90a_build_files.py
      - engine/third_party/**
      - engine/sycl/**
      - engine/metal/**
      - terminal/setup.py
      - tools/packaging/build_cuda_linux.sh
      - tools/packaging/build_hip_linux.sh
      - tools/packaging/build_sycl_linux.sh
  pull_request:
    paths:
      - .github/workflows/backends.yml
      - engine/CMakeLists.txt
      - engine/CMakePresets.json
      - engine/cmake/**
      - engine/src/**
      - engine/include/**
      - engine/tests/core/hip_device_policy_test.cpp
      - engine/tests/hip/gfx90a*
      - tools/test_gfx90a_build_files.py
      - engine/third_party/**
      - engine/sycl/**
      - engine/metal/**
      - terminal/setup.py
      - tools/packaging/build_cuda_linux.sh
      - tools/packaging/build_hip_linux.sh
      - tools/packaging/build_sycl_linux.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backends-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  cuda:
    name: CUDA ${{ matrix.cuda }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: nvidia/cuda:${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the cuda12 package is the one for Pascal and Volta: sm_60 needs STRATA_EXPERIMENTAL_SM60 (tools/packaging/build_cuda_linux.sh)
          - { cuda: '12.9', image: '12.9.1-devel-ubuntu24.04', archs: '60-real;61-real;70-real;86-real', sm60: 'ON' }
          - { cuda: '13.0', image: '13.0.2-devel-ubuntu24.04', archs: '75-real;86-real;120-real', sm60: 'OFF' }
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build ccache
          cmake --version | head -1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-cuda${{ matrix.cuda }}-${{ hashFiles('engine/CMakeLists.txt', 'engine/src/**', 'engine/include/**', 'engine/cmake/**') }}
          restore-keys: ccache-cuda${{ matrix.cuda }}-
      - name: Configure (preset cuda-compile)
        run: |
          nvcc --version | tail -2
          cmake -S engine --preset cuda-compile -B build \
            "-DCMAKE_CUDA_ARCHITECTURES=${{ matrix.archs }}" -DSTRATA_EXPERIMENTAL_SM60=${{ matrix.sm60 }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
      - name: Build strata
        run: cmake --build build --target strata -j "$(nproc)"
      - name: Cache statistics
        run: ccache -s | head -8

  hip:
    name: HIP ROCm 7.2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: rocm/dev-ubuntu-24.04:7.2.4-complete
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build ccache
          cmake --version | head -1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-hip72-${{ hashFiles('engine/CMakeLists.txt', 'engine/src/**', 'engine/include/**', 'engine/cmake/**') }}
          restore-keys: ccache-hip72-
      - name: Configure (preset hip-compile)
        run: |
          /opt/rocm/llvm/bin/clang++ --version | head -1
          cmake -S engine --preset hip-compile -B build \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ -DCMAKE_HIP_COMPILER_ROCM_ROOT=/opt/rocm -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_HIP_COMPILER_LAUNCHER=ccache
      - name: Build strata
        run: cmake --build build --target strata -j "$(nproc)"
      - name: Cache statistics
        run: ccache -s | head -8

  hip-gfx90a:
    name: Experimental gfx90a M1 (compile and link; no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: rocm/dev-ubuntu-24.04:7.2.4-complete@sha256:92f309c51b52cef8762867848f1529dee821624f23cd5df38455e819538f762f
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build ccache python3 binutils
          cmake --version | head -1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-gfx90a-rocm724-${{ hashFiles('engine/CMakeLists.txt', 'engine/src/**', 'engine/include/**', 'engine/cmake/**', 'engine/tests/hip/gfx90a*') }}
          restore-keys: ccache-gfx90a-rocm724-
      - name: Configuration rejection checks (no GPU)
        run: python3 tools/test_gfx90a_build_files.py
      - name: Configure the gfx90a test targets
        working-directory: engine
        run: |
          /opt/rocm/llvm/bin/clang++ --version | head -1
          cmake --preset hip-gfx90a-tests \
            -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ -DCMAKE_HIP_COMPILER_ROCM_ROOT=/opt/rocm -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_HIP_COMPILER_LAUNCHER=ccache
      - name: Check the generated gfx90a compilation database
        run: python3 tools/test_gfx90a_build_files.py --compile-commands engine/build/hip-gfx90a-tests/compile_commands.json
      - name: Compile and link engine, host policy and GPU tests
        working-directory: engine
        run: cmake --build --preset hip-gfx90a-tests --parallel "$(nproc)"
      - name: Run only the host policy test
        run: ./engine/build/hip-gfx90a-tests/hip_device_policy_test
      - name: Check linked libraries and gfx90a code objects (no GPU execution)
        shell: bash
        run: |
          build="$PWD/engine/build/hip-gfx90a-tests"
          mkdir -p "$build/checks"
          cd "$build/checks"
          for target in strata strata-device gfx90a_intrinsics gfx90a_mfma_parity gfx90a_mmvq_parity gfx90a_expert_parity \
            router_top10_parity gdn_parity gdn_chunk_parity qsa_parity qsa_scores_parity; do
            readelf -d "$build/$target" > "$build/checks/$target.dynamic.txt"
            if grep -Ei 'NEEDED.*lib(cuda|cudart|cublas)' "$build/checks/$target.dynamic.txt"; then
              echo "$target unexpectedly links a CUDA library" >&2
              exit 1
            fi
            ldd "$build/$target" | tee "$build/checks/$target.ldd.txt"
            if grep -q 'not found' "$build/checks/$target.ldd.txt"; then
              exit 1
            fi
            /opt/rocm/llvm/bin/llvm-objdump --offloading "$build/$target" | tee "$build/checks/$target.offloading.txt"
            grep -Eq 'hipv[0-9]+-amdgcn-amd-amdhsa--gfx90a([+:[:space:]]|$)' "$build/checks/$target.offloading.txt"
          done
      - name: Keep build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfx90a-m1-build-evidence
          path: |
            engine/build/hip-gfx90a-tests/CMakeCache.txt
            engine/build/hip-gfx90a-tests/compile_commands.json
            engine/build/hip-gfx90a-tests/checks/*.txt
      - name: Cache statistics
        if: always()
        run: ccache -s | head -8

  sycl:
    # The engine needs oneAPI 2026.1 or newer (engine/sycl/include/dpct/util.hpp uses the entangle and chunked_partition extensions, which the
    # 2025.3.2 compiler does not have: it stops at "no member named 'entangle'"; the intel/oneapi-basekit images end at 2025.3), so the
    # compiler comes from Intel's apt repository at a pinned version.
    name: SYCL oneAPI 2026.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: ubuntu:24.04
    steps:
      - name: Tools and oneAPI 2026.1
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build ccache wget gpg
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" > /etc/apt/sources.list.d/oneAPI.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            intel-oneapi-compiler-dpcpp-cpp-2026.1=2026.1.1-325 intel-oneapi-mkl-devel-2026.1=2026.1.0-236
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-sycl-${{ hashFiles('engine/CMakeLists.txt', 'engine/src/**', 'engine/include/**', 'engine/sycl/**') }}
          restore-keys: ccache-sycl-
      - name: Configure and build (the commands of tools/packaging/build_sycl_linux.sh)
        shell: bash
        run: |
          . /opt/intel/oneapi/setvars.sh --force >/dev/null
          icpx --version | head -1
          cmake -S engine/sycl -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx \
            -DSTRATA_SYCL_PARITY=OFF -DSTRATA_SYCL_IQ_DECODE_FAST=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target strata -j "$(nproc)"
      - name: Cache statistics
        run: ccache -s | head -8

  metal:
    name: Metal strata
    # the macOS 26 SDK: engine/metal/src/mtl_rt.mm names MTLGPUFamilyMetal4 behind @available (a run-time check); the names must be in the SDK
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # engine/metal/setup_mac.py's metal-cpp pin (the same as metal-build.yml)
      METAL_CPP_URL: https://developer.apple.com/metal/cpp/files/metal-cpp_26.zip
      METAL_CPP_SHA256: 4df3c078b9aadcb516212e9cb03004cbc5ce9a3e9c068fa3144d021db585a3a4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tools
        run: brew install ninja ccache
      - name: metal-cpp
        run: |
          curl -fsSL "$METAL_CPP_URL" -o metal-cpp.zip
          echo "$METAL_CPP_SHA256  metal-cpp.zip" | shasum -a 256 -c -
          unzip -q metal-cpp.zip -d _mcpp
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-metal-${{ hashFiles('engine/CMakeLists.txt', 'engine/src/**', 'engine/include/**', 'engine/metal/**') }}
          restore-keys: ccache-metal-
      - name: Configure
        run: |
          cmake -S engine/metal -B build-metal -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMETAL_CPP_DIR="$PWD/_mcpp/metal-cpp" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build and link strata
        run: cmake --build build-metal --target strata
