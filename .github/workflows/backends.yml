name: Backend compile checks

# Compile and link every engine backend with a pinned toolchain, without a GPU: nothing is run, so a call into a kernel that only
# exists for another backend (or an API a toolkit version dropped) fails here instead of on a user's machine.  Hardware runs are separate.
#   CUDA 12.9 and 13.0   nvidia/cuda devel container   targets strata, strata_kq          (CMake preset cuda-compile)
#   HIP (ROCm 7.2)       rocm/dev container            target strata                      (CMake preset hip-compile)
#   SYCL (oneAPI 2026.1) ubuntu + Intel's apt repo     target strata of sycl/             (the commands of packaging/build_sycl_linux.sh)
#   Metal                macOS runner                  targets strata and strata_ds4      (metal/; metal-build.yml keeps its own strata build)
# llama.cpp (ggml) comes at the commit pinned in setup.py (LLAMA_CPP_COMMIT), the same one the release builds use.
# Architectures are fewer than the release package's (compile time); the flags that decide which sources and defines are built are the release's.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/backends.yml
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - src/**
      - include/**
      - third_party/**
      - sycl/**
      - metal/**
      - setup.py
      - packaging/build_cuda_linux.sh
      - packaging/build_hip_linux.sh
      - packaging/build_sycl_linux.sh
  pull_request:
    paths:
      - .github/workflows/backends.yml
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - src/**
      - include/**
      - third_party/**
      - sycl/**
      - metal/**
      - setup.py
      - packaging/build_cuda_linux.sh
      - packaging/build_hip_linux.sh
      - packaging/build_sycl_linux.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backends-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  cuda:
    name: CUDA ${{ matrix.cuda }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: nvidia/cuda:${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the cuda12 package is the one for Pascal and Volta: sm_60 needs STRATA_EXPERIMENTAL_SM60 (packaging/build_cuda_linux.sh)
          - { cuda: '12.9', image: '12.9.1-devel-ubuntu24.04', archs: '60-real;61-real;70-real;86-real', sm60: 'ON' }
          - { cuda: '13.0', image: '13.0.2-devel-ubuntu24.04', archs: '75-real;86-real;120-real', sm60: 'OFF' }
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build ccache
          cmake --version | head -1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: llama.cpp (ggml) at the pinned commit
        run: |
          commit=$(sed -n 's/^LLAMA_CPP_COMMIT = "\(.*\)"/\1/p' setup.py)
          mkdir llama.cpp && cd llama.cpp && git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch -q --depth 1 origin "$commit" && git checkout -q FETCH_HEAD
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-cuda${{ matrix.cuda }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'cmake/**') }}
          restore-keys: ccache-cuda${{ matrix.cuda }}-
      - name: Configure (preset cuda-compile)
        run: |
          nvcc --version | tail -2
          cmake --preset cuda-compile -B build -DSTRATA_GGML_DIR="$PWD/llama.cpp" \
            "-DCMAKE_CUDA_ARCHITECTURES=${{ matrix.archs }}" -DSTRATA_EXPERIMENTAL_SM60=${{ matrix.sm60 }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
      - name: Build strata and strata_kq
        run: cmake --build build --target strata strata_kq -j "$(nproc)"
      - name: Cache statistics
        run: ccache -s | head -8

  hip:
    name: HIP ROCm 7.2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: rocm/dev-ubuntu-24.04:7.2.4-complete
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build ccache
          cmake --version | head -1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: llama.cpp (ggml) at the pinned commit
        run: |
          commit=$(sed -n 's/^LLAMA_CPP_COMMIT = "\(.*\)"/\1/p' setup.py)
          mkdir llama.cpp && cd llama.cpp && git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch -q --depth 1 origin "$commit" && git checkout -q FETCH_HEAD
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-hip72-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'cmake/**') }}
          restore-keys: ccache-hip72-
      - name: Configure (preset hip-compile)
        run: |
          /opt/rocm/llvm/bin/clang++ --version | head -1
          cmake --preset hip-compile -B build -DSTRATA_GGML_DIR="$PWD/llama.cpp" \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ -DCMAKE_HIP_COMPILER_ROCM_ROOT=/opt/rocm -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_HIP_COMPILER_LAUNCHER=ccache
      - name: Build strata
        run: cmake --build build --target strata -j "$(nproc)"
      - name: Cache statistics
        run: ccache -s | head -8

  sycl:
    # The engine needs oneAPI 2026.1 or newer (sycl/include/dpct/util.hpp uses the entangle and chunked_partition extensions, which the
    # 2025.3.2 compiler does not have: it stops at "no member named 'entangle'"; the intel/oneapi-basekit images end at 2025.3), so the
    # compiler comes from Intel's apt repository at a pinned version.
    name: SYCL oneAPI 2026.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: ubuntu:24.04
    steps:
      - name: Tools and oneAPI 2026.1
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build ccache wget gpg
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" > /etc/apt/sources.list.d/oneAPI.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            intel-oneapi-compiler-dpcpp-cpp-2026.1=2026.1.1-325 intel-oneapi-mkl-devel-2026.1=2026.1.0-236
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: llama.cpp (ggml) at the pinned commit
        run: |
          commit=$(sed -n 's/^LLAMA_CPP_COMMIT = "\(.*\)"/\1/p' setup.py)
          mkdir llama.cpp && cd llama.cpp && git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch -q --depth 1 origin "$commit" && git checkout -q FETCH_HEAD
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-sycl-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'sycl/**') }}
          restore-keys: ccache-sycl-
      - name: Configure and build (the commands of packaging/build_sycl_linux.sh)
        shell: bash
        run: |
          . /opt/intel/oneapi/setvars.sh --force >/dev/null
          icpx --version | head -1
          cmake -S sycl -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx \
            -DSTRATA_SYCL_PARITY=OFF -DSTRATA_SYCL_IQ_DECODE_FAST=ON -DSTRATA_GGML_DIR="$PWD/llama.cpp" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target strata -j "$(nproc)"
      - name: Cache statistics
        run: ccache -s | head -8

  metal:
    name: Metal strata + strata_ds4
    # the macOS 26 SDK: metal/src/mtl_rt.mm names MTLGPUFamilyMetal4 behind @available (a run-time check); the names must be in the SDK
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # metal/setup_mac.py's metal-cpp pin (the same as metal-build.yml)
      METAL_CPP_URL: https://developer.apple.com/metal/cpp/files/metal-cpp_26.zip
      METAL_CPP_SHA256: 4df3c078b9aadcb516212e9cb03004cbc5ce9a3e9c068fa3144d021db585a3a4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tools
        run: brew install ninja ccache
      - name: metal-cpp
        run: |
          curl -fsSL "$METAL_CPP_URL" -o metal-cpp.zip
          echo "$METAL_CPP_SHA256  metal-cpp.zip" | shasum -a 256 -c -
          unzip -q metal-cpp.zip -d _mcpp
      - name: llama.cpp (ggml) at the pinned commit
        run: |
          commit=$(sed -n 's/^LLAMA_CPP_COMMIT = "\(.*\)"/\1/p' setup.py)
          mkdir llama.cpp && cd llama.cpp && git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch -q --depth 1 origin "$commit" && git checkout -q FETCH_HEAD
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-metal-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'metal/**') }}
          restore-keys: ccache-metal-
      - name: Configure
        run: |
          cmake -S metal -B build-metal -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMETAL_CPP_DIR="$PWD/_mcpp/metal-cpp" -DSTRATA_GGML_DIR="$PWD/llama.cpp" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build and link strata and strata_ds4
        run: cmake --build build-metal --target strata strata_ds4
