name: CPU CI

on:
  push:
    branches: [main, codex/adaptive-memory]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install server and test dependencies
        run: python -m pip install -r requirements.txt jsonschema==4.26.0
      - name: Server regression tests (mock engines, no model)
        run: python -m unittest discover -s serve -p "test_*.py" -v
      - name: Parallel setup regression tests
        run: python -m unittest tools.test_setup_parallel -v

  native:
    name: Native CPU (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure standalone CPU tests
        run: >-
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release
          -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_ENABLE_HIP=OFF
          -DSTRATA_NATIVE_EXPERTS=OFF -DSTRATA_BUILD_TESTS=OFF
          -DSTRATA_BUILD_CONVERSATION_TESTS=ON
      - name: Build standalone CPU tests
        run: >-
          cmake --build build-ci --config Release --parallel 2 --target
          conversation_cache_test conversation_memory_test conv_cache_test
          serve_window_test coupled_draft_test
      - name: Run standalone CPU tests
        run: >-
          ctest --test-dir build-ci -C Release --output-on-failure --no-tests=error
          --timeout 120 -R "^(conversation_cache_test|conversation_memory_test|conv_cache_test|serve_window_test|coupled_draft_test)$"
      - name: Preserve native test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-test-logs-${{ matrix.os }}
          path: build-ci/Testing/Temporary/*.log
          if-no-files-found: warn
          retention-days: 14
