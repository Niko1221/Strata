name: Model manager

on:
  pull_request:
    paths:
      - 'tools/strata_models.py'
      - 'tools/strata_mcp.py'
      - 'tools/test_strata_models.py'
      - 'tools/test_strata_mcp.py'
      - 'tools/test_strata_models_web.js'
      - 'serve/web/models.*'
      - 'setup.py'
      - 'models.sh'
      - 'MODELS.bat'
      - '.github/workflows/model-manager.yml'
  push:
    branches: [feature/web-model-manager]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Create a virtual environment (including Windows Python launcher)
        run: python -m venv --without-pip .test-venv
      - name: Model manager and management helper tests (no GPU or downloads)
        run: >-
          python -c "import os,subprocess,sys; from pathlib import Path;
          py=Path('.test-venv') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python');
          sys.exit(subprocess.call([str(py), '-m', 'unittest', 'tools.test_strata_models', 'tools.test_strata_mcp', '-v']))"
      - name: Python syntax
        run: python -m py_compile tools/strata_models.py tools/strata_mcp.py tools/test_strata_models.py tools/test_strata_mcp.py
      - name: Models page behavior
        run: node --test tools/test_strata_models_web.js
      - name: Linux launcher syntax
        if: runner.os == 'Linux'
        run: sh -n models.sh
