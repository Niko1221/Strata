name: Minimal serving runtime

on:
  push:
    paths:
      - .github/workflows/terminal-minimal-server.yml
      - requirements.txt
      - strata.py
      - strata_cli/**
      - strata_control/**
      - serve/**
      - tests/terminal/test_runtime.py
      - tools/minimal_server_smoke.py
      - tools/strata_tokenizer.py
  pull_request:
    paths:
      - .github/workflows/terminal-minimal-server.yml
      - requirements.txt
      - strata.py
      - strata_cli/**
      - strata_control/**
      - serve/**
      - tests/terminal/test_runtime.py
      - tools/minimal_server_smoke.py
      - tools/strata_tokenizer.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-engine:
    name: Linux / minimal runtime and JSON validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install only pinned runtime requirements
        id: runtime
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/strata-runtime-venv"
          "$RUNNER_TEMP/strata-runtime-venv/bin/python" -m pip install -r requirements.txt
      - name: Check fake-engine serving without terminal packages
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          report = Path(os.environ['RUNNER_TEMP']) / 'minimal-server-smoke.json'
          python = str(Path(os.environ['RUNNER_TEMP']) / 'strata-runtime-venv' / 'bin' / 'python')
          subprocess.run([python, 'tools/minimal_server_smoke.py',
                          '--report', str(report)], check=True)
          print(report.read_text())
          PY
      - name: Run legacy parser suite with explicit strict-guard opt-out
        shell: bash
        run: |
          STRATA_TOOL_MASK_STRICT=0 "$RUNNER_TEMP/strata-runtime-venv/bin/python" -m unittest discover -s serve -p 'test_*.py'
      - name: Verify automatic request constraints without mask environment
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        shell: bash
        run: |
          "$RUNNER_TEMP/strata-runtime-venv/bin/python" -c 'from serve import constrain; assert constrain.available()'
          env -u STRATA_TOOL_MASK -u STRATA_TOOL_NAME_ENUM -u STRATA_TOOL_MASK_STRICT \
            "$RUNNER_TEMP/strata-runtime-venv/bin/python" -m unittest serve.test_tool_name_constraint serve.test_constrain serve.test_structured
      - name: Verify optional JSON Schema postvalidation
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        shell: bash
        run: |
          "$RUNNER_TEMP/strata-runtime-venv/bin/python" -m pip install 'jsonschema==4.26.0'
          STRATA_TOOL_MASK_STRICT=0 "$RUNNER_TEMP/strata-runtime-venv/bin/python" -m unittest serve.test_constrain serve.test_structured
