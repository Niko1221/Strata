name: Windows Desktop Window Lifecycle

on:
  push:
    paths:
      - 'apps/desktop/src-tauri/**'
      - '.github/workflows/desktop-window-lifecycle.yml'
  pull_request:
    paths:
      - 'apps/desktop/src-tauri/**'
      - '.github/workflows/desktop-window-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Prepare Compile-Only Resources
        shell: pwsh
        run: |
          # Tests and the unbundled executable need no downloaded Node, Control,
          # Engine or frontend. Only this disposable build checkout is changed.
          $configPath = 'apps/desktop/src-tauri/tauri.conf.json'
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json -AsHashtable
          $config.build.frontendDist = 'ci-placeholder'
          $config.bundle.resources = @{}
          $config.bundle.active = $false
          New-Item -ItemType Directory -Path 'apps/desktop/src-tauri/ci-placeholder' -Force | Out-Null
          Set-Content -LiteralPath 'apps/desktop/src-tauri/ci-placeholder/index.html' -Value '<!doctype html><title>Compile Only</title>'
          $config | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $configPath
      - name: Test Native Windows Lifecycle
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test --locked -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Unbundled Native Shell
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record Native Artifact Provenance
        shell: pwsh
        run: |
          $exe = 'apps/desktop/src-tauri/target/release/strata-desktop.exe'
          New-Item -ItemType Directory -Path 'window-lifecycle-artifact' | Out-Null
          Copy-Item -LiteralPath $exe -Destination 'window-lifecycle-artifact/strata-desktop.exe'
          @{
            schema = 1
            sourceCommit = $env:GITHUB_SHA
            sourceRepository = $env:GITHUB_REPOSITORY
            sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            bytes = (Get-Item -LiteralPath $exe).Length
            compileOnlyResources = $true
          } | ConvertTo-Json | Set-Content -LiteralPath 'window-lifecycle-artifact/provenance.json'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-window-lifecycle
          path: window-lifecycle-artifact/
          if-no-files-found: error
          retention-days: 14
